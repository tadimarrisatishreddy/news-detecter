<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - TruthLens AI</title>
  <meta name="description" content="Sign in to your TruthLens AI Fake News Detector account.">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top, rgba(79, 70, 229, 0.15) 0%, transparent 60%), var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.3s ease-out;
    }
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .auth-brand h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .back-home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.25rem;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-decoration: none;
    }
    .back-home-link:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/" style="text-decoration: none;">
          <img src="/static/favicon.svg" alt="TruthLens Logo" width="48" height="48">
        </a>
        <h1>TruthLens AI</h1>
        <p class="auth-subtitle">Sign in to access AI detection, fact-checking & reports</p>
      </div>

      <form id="page-login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" autocomplete="email" required placeholder="user@example.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="login-password" style="margin-bottom: 0;">Password</label>
          </div>
          <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;" id="btn-submit-login">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="/register">Create an account</a>
      </div>
    </div>

    <a href="/" class="back-home-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Return to Main Studio
    </a>
  </div>

  <div id="toast-container"></div>

  <script>
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    const form = document.getElementById('page-login-form');
    const submitBtn = document.getElementById('btn-submit-login');

    // Show registered notification if redirected from register page
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === '1') {
      showToast('Registration successful! Please sign in with your credentials.', 'success');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || data.message || 'Login failed');
        }

        // Store tokens in localStorage
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);

        showToast('Signed in successfully! Redirecting...', 'success');
        
        // Redirect to destination or main studio
        const redirect = urlParams.get('redirect') || '/';
        setTimeout(() => {
          window.location.href = redirect;
        }, 800);
      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
